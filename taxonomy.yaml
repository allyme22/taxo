# Central taxonomy shared by Athena and Mimir. This repository is the single
# source of truth for the vocabulary: change values here, never in a consumer
# repository.
#
# Facet values are lowercase [a-z0-9_]. vuln_class keys are fixed points of the
# database layer's normalize_vuln_class(). Per entry, `description` is the
# display name, `aliases` are alternate phrasings resolved on write, `cwe` names
# the matching CWE class when a code-level weakness fits, and `category` groups
# entries for reporting.
